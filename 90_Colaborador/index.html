 const situaciones=[

 contenido.innerHTML=`
 <div class="seguimiento"><p class="texto-pregunta">¿Cuál opción describe mejor tu situación actual? <span class="req">*</span></p>${selectHtml('SituacionActual',situaciones,estado.SituacionActual)}</div>
 <div class="seguimiento ${estado.SituacionActual==='Quiero continuar en mi puesto actual'?'':'oculto'}"><p class="texto-pregunta">¿Consideras que existe algún aspecto de tu experiencia, puesto o entorno de trabajo que podría mejorarse o fortalecerse? <span class="req">*</span></p>${radios('R1_MEJORA',['Sí','No'],estado.R1_MEJORA)}<div class="${estado.R1_MEJORA==='Sí'?'':'oculto'}"><p class="texto-pregunta">Selecciona el aspecto que podría fortalecerse <span class="req">*</span></p>${selectHtml('R1_ASPECTO',aspectos,estado.R1_ASPECTO)}<textarea id="R1_COMENT" class="campo" placeholder="Comparte información adicional si lo consideras necesario">${escapar(estado.R1_COMENT)}</textarea></div></div>
 <div class="seguimiento ${estado.SituacionActual==='Quiero continuar, pero necesito apoyo o ajustes'?'':'oculto'}"><p class="texto-pregunta">¿Qué apoyo tendría mayor impacto? <span class="req">*</span></p>${checks('R2_APOYOS',apoyos,estado.R2_APOYOS)}<textarea id="R2_COMENT" class="campo" placeholder="Describe el apoyo o ajuste que necesitas">${escapar(estado.R2_COMENT)}</textarea><p class="texto-pregunta">¿Te gustaría que RH se comunique contigo? <span class="req">*</span></p>${radios('R2_CONTACTO_RH',['Sí','No'],estado.R2_CONTACTO_RH)}</div>
 <div class="seguimiento ${estado.SituacionActual==='Me interesa construir un plan de aprendizaje o desarrollo'?'':'oculto'}"><p class="texto-pregunta">¿Qué tipo de desarrollo te interesa? <span class="req">*</span></p>${checks('R3_DESARROLLO',desarrollo,estado.R3_DESARROLLO)}</div>

function limpiarRutasNoSeleccionadas(){
 const s=estado.SituacionActual;
 if(s!=='Quiero continuar en mi puesto actual'){estado.R1_MEJORA='';estado.R1_ASPECTO='';estado.R1_COMENT=''}
 if(s!=='Quiero continuar, pero necesito apoyo o ajustes'){estado.R2_APOYOS=[];estado.R2_COMENT='';estado.R2_CONTACTO_RH=''}
 if(s!=='Me interesa construir un plan de aprendizaje o desarrollo'){estado.R3_DESARROLLO=[];estado.R3_PLAZO=''}
 if(s!=='Estoy considerando dejar la organización'){estado.R4_MOTIVO='';estado.R4_ACCION='';estado.R4_COMENT='';estado.R4_CONTACTO_RH=''}
 if(s!=='Ya tomé la decisión de salir'){estado.R5_COMUNICADA='';estado.R5_CONTACTO_RH='';estado.R5_FECHA_SALIDA='';estado.R5_FECHA_NO_DEFINIDA=false}
}
function validar(){
 const p=pasos[paso];
 if(p.tipo==='datos')return estado.APaterno.trim()&&estado.AMaterno.trim()&&estado.Nombres.trim()&&estado.NumeroColab.trim()&&/^\S+@\S+\.\S+$/.test(estado.Correo.trim())&&estado.Marca.trim()&&estado.Sucursal.trim()&&estado.Puesto.trim()&&estado.FechaIngreso&&estado.NombreCompletoLider.trim();
 if(p.tipo==='seccion'){const s=SECCIONES[p.indice];return s.questions.every((_,j)=>estado.q[s.start+j]>=1)}
 if(!estado.SituacionActual||!estado.Consentimiento)return false;
 if(estado.SituacionActual==='Quiero continuar en mi puesto actual')return estado.R1_MEJORA&&(estado.R1_MEJORA==='No'||estado.R1_ASPECTO);
 if(estado.SituacionActual==='Quiero continuar, pero necesito apoyo o ajustes')return estado.R2_APOYOS.length>0&&estado.R2_COMENT.trim()&&estado.R2_CONTACTO_RH;
 if(estado.SituacionActual==='Me interesa construir un plan de aprendizaje o desarrollo')return estado.R3_DESARROLLO.length>0;
 if(estado.SituacionActual==='Estoy considerando dejar la organización')return estado.R4_MOTIVO&&estado.R4_ACCION&&(estado.R4_ACCION!=='Sí'||estado.R4_COMENT.trim())&&estado.R4_CONTACTO_RH;
 if(estado.SituacionActual==='Ya tomé la decisión de salir')return estado.R5_COMUNICADA&&estado.R5_FECHA_SALIDA;
 return false;
}

 for(let i=1;i<=12;i++)p[`Q${i}`]=Number(estado.q[i]);
 return Object.assign(p,{SituacionActual:estado.SituacionActual,R1_MEJORA:estado.R1_MEJORA,R1_ASPECTO:estado.R1_ASPECTO,R1_COMENT:estado.R1_COMENT.trim(),R2_APOYOS:estado.R2_APOYOS.join('; '),R2_COMENT:estado.R2_COMENT.trim(),R2_CONTACTO_RH:estado.R2_CONTACTO_RH,R3_DESARROLLO:estado.R3_DESARROLLO.join('; '),R4_MOTIVO:estado.R4_MOTIVO,R4_ACCION:estado.R4_ACCION,R4_COMENT:estado.R4_COMENT.trim(),R4_CONTACTO_RH:estado.R4_CONTACTO_RH,R5_COMUNICADA:estado.R5_COMUNICADA,R5_FECHA_SALIDA:estado.R5_FECHA_SALIDA,Consentimiento:Boolean(estado.Consentimiento)});
}
function render(){error.classList.remove('visible');const p=pasos[paso];titulo.textContent=p.titulo;anterior.style.visibility=paso?'visible':'hidden';continuar.textContent=paso===pasos.length-1?'Enviar respuestas':'Continuar →';continuar.className=paso===pasos.length-1?'boton enviar':'boton continuar';p.tipo==='datos'?renderDatos():p.tipo==='seccion'?renderSeccion(p.indice):renderRuta()}
continuar.onclick=async()=>{if(!validar()){error.textContent='Completa todos los campos obligatorios y acepta el consentimiento.';error.classList.add('visible');return}if(paso<pasos.length-1){paso++;render();scrollTo({top:0,behavior:'smooth'});return}if(FLOW_URL.includes('PEGA_AQUI')){error.textContent='Configura la URL del flujo.';error.classList.add('visible');return}continuar.disabled=true;continuar.textContent='Enviando...';try{const r=await fetch(FLOW_URL,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify(payload())});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={mensaje:t}}if(!r.ok||d.guardado===false)throw new Error(d.mensaje||`HTTP ${r.status}`);$('formulario').hidden=true;$('final').hidden=false}catch(e){error.textContent=`No fue posible registrar la respuesta. ${e.message}`;error.classList.add('visible');continuar.disabled=false;continuar.textContent='Enviar respuestas'}};anterior.onclick=()=>{if(paso){paso--;render()}};render();
</script></body></html>
