<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguimiento 60 días · Líder</title><style>
:root{--azul:#108ec3;--turquesa:#16a2ad;--menta:#4cb88e;--verde:#5aae71;--lima:#92bc48;--texto:#173444;--muted:#60747e;--borde:#dde9ea;--error:#b42318}*{box-sizing:border-box}html{scroll-behavior:smooth}body{min-height:100vh;margin:0;padding:28px 16px;font-family:Arial,Helvetica,sans-serif;color:var(--texto);background:radial-gradient(circle at 0 0,rgba(16,142,195,.14),transparent 35%),radial-gradient(circle at 100% 100%,rgba(146,188,72,.15),transparent 38%),linear-gradient(145deg,#f7fcfd,#f4faf7 52%,#fafceb)}.tarjeta{width:100%;max-width:820px;margin:auto;overflow:hidden;background:#fff;border-radius:28px;box-shadow:0 24px 70px rgba(16,142,195,.14)}.barra{height:8px;background:linear-gradient(90deg,var(--azul),var(--turquesa),var(--menta),var(--lima))}.interior{padding:36px}.encabezado{text-align:center}.insignia{display:inline-flex;padding:9px 16px;border-radius:999px;background:rgba(22,162,173,.09);color:var(--turquesa);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}.titulo{margin:20px 0 0;font-size:30px;line-height:1.25;outline:none}.contenido{margin-top:28px;padding:24px;background:#f8fafb;border-radius:24px}.fila{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grupo{margin-bottom:18px}.etiqueta{display:block;margin-bottom:7px;font-size:14px;font-weight:700}.req{color:var(--azul)}.campo{width:100%;padding:13px 14px;border:1px solid var(--borde);border-radius:12px;background:#fff;color:var(--texto);font:14px Arial;outline:none}.campo:focus{border-color:var(--turquesa);box-shadow:0 0 0 4px rgba(22,162,173,.1)}textarea.campo{min-height:110px;resize:vertical;line-height:1.5}.pregunta,.seguimiento{margin:0 0 18px;padding:18px;border:1px solid #e7f0f1;border-radius:16px;background:#fff}.texto-pregunta{margin:0 0 14px;font-size:14px;font-weight:700;line-height:1.5}.opciones{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.opcion{position:relative}.opcion input{position:absolute;width:1px;height:1px;opacity:0}.opcion label{min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 5px;border:1px solid #e3ecee;border-radius:12px;background:#f7fafa;color:#526b76;font-size:11px;text-align:center;cursor:pointer}.opcion input:checked+label{background:linear-gradient(135deg,var(--azul),var(--turquesa));color:#fff;border-color:var(--turquesa)}.numero{margin-bottom:5px;color:var(--azul);font-size:20px;font-weight:700}.opcion input:checked+label .numero{color:#fff}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:9px;padding:11px;border:1px solid var(--borde);border-radius:11px;background:#f9fbfb;font-size:13px;line-height:1.35}.check input,.consentimiento input{accent-color:var(--turquesa)}.radios{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.radios.tres{grid-template-columns:repeat(3,1fr)}.radios .opcion label{min-height:52px;font-size:12px;font-weight:700}.consentimiento{margin-top:20px;padding:18px;border:1px solid #cfe3e7;border-radius:16px;background:#f4fbfb}.consentimiento label{display:flex;align-items:flex-start;gap:12px;font-size:13px;line-height:1.55;cursor:pointer}.consentimiento input{width:18px;height:18px;flex:none;margin-top:2px}.consentimiento strong{display:block;margin-bottom:3px;font-size:14px}.nota{margin:8px 0 0 30px;color:var(--muted);font-size:11px}.error{display:none;margin-top:18px;padding:13px;border:1px solid #ffd1cc;border-radius:12px;background:#fff5f5;color:var(--error);font-size:13px}.error.visible{display:block}.navegacion{display:flex;justify-content:space-between;gap:12px;margin-top:28px}.boton{min-height:46px;padding:12px 20px;border-radius:12px;font:600 14px Arial;cursor:pointer}.anterior{background:#fff;color:#526b76;border:1px solid var(--borde)}.continuar{margin-left:auto;border:0;background:linear-gradient(135deg,var(--azul),var(--turquesa));color:#fff}.enviar{margin-left:auto;border:0;background:linear-gradient(135deg,var(--verde),var(--lima));color:#fff}.boton:disabled{opacity:.6}.oculto{display:none!important}.final{padding:54px 20px;text-align:center}.check-final{width:64px;height:64px;margin:auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(76,184,142,.15);color:var(--verde);font-size:36px;font-weight:700}.final p{color:var(--muted);line-height:1.6}@media(max-width:700px){body{padding:14px 10px}.interior{padding:24px 17px}.titulo{font-size:23px}.contenido{padding:16px}.fila,.checks,.opciones,.radios,.radios.tres{grid-template-columns:1fr}.opcion label{min-height:54px}.boton{flex:1}.continuar,.enviar{margin-left:0}}
</style></head><body><main class="tarjeta"><div class="barra"></div><div class="interior"><div id="formulario"><header class="encabezado"><p class="insignia">✦ Seguimiento CH · 60 días ✦</p><h1 id="titulo" class="titulo">Datos del líder y colaborador</h1></header><section id="contenido" class="contenido"></section><div id="error" class="error"></div><footer class="navegacion"><button id="anterior" class="boton anterior" type="button">← Anterior</button><button id="continuar" class="boton continuar" type="button">Continuar →</button></footer></div><section id="final" class="final" hidden><div class="check-final">✓</div><h1>¡Gracias por completar el seguimiento!</h1><p>La información fue registrada para seguimiento confidencial de Recursos Humanos.</p></section></div></main><script>
const FLOW_URL='https://default226a5b51d2894b31be72824bcc61e8.91.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/10/workflows/442bf276b5fc4d99afb8695f92cdaa64/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=zBFLh-NO2hg7WkNEA35bJ4PiNzWkSRSokk3wZpJHABA';
const SECCIONES=[{"title": "Interés y disposición para el trabajo", "start": 1, "questions": ["El colaborador demuestra interés por las actividades y responsabilidades de su puesto.", "El colaborador muestra disposición para asumir nuevas tareas o responsabilidades cuando se requiere.", "El colaborador cumple con las actividades o proyectos dentro de los plazos establecidos.", "El colaborador conoce y aplica las políticas y procedimientos generales de GDA.", "El colaborador conoce y aplica las normas específicas de su puesto.", "El colaborador mantiene relaciones profesionales y respetuosas con sus compañeros.", "El colaborador se comunica de manera efectiva con su responsable directo.", "El colaborador demuestra las habilidades técnicas necesarias para las actividades que actualmente tiene asignadas."]}, {"title": "Compromiso con la institución", "start": 9, "questions": ["El colaborador demuestra las aptitudes y competencias esperadas para esta etapa de adaptación.", "Durante el periodo observado, el colaborador se ha mantenido libre de quejas fundamentadas de clientes internos o externos.", "El colaborador cumple con el código de vestimenta y los lineamientos de imagen institucional aplicables a su puesto.", "El colaborador cumple puntualmente con su horario y compromisos laborales."]}];
const ESCALA=['No lo demuestra','Lo demuestra en pocas ocasiones','Lo demuestra de manera parcial','Lo demuestra de manera consistente','Lo demuestra de manera sobresaliente'];
const pasos=[{tipo:'datos',titulo:'Datos del líder y colaborador'},...SECCIONES.map((s,i)=>({tipo:'seccion',indice:i,titulo:s.title})),{tipo:'seguimiento',titulo:'Seguimiento de adaptación'}];
let paso=0;
const estado={NombreCompletoLider:'',CorreoLider:'',NumeroColab:'',Marca:'',Sucursal:'',Puesto:'',q:{},L1:[],L1_COMENT:'',L2:'',L2_CAT:[],L2_COMENT:'',L3:'',L4:[],L4_COMENT:'',Consentimiento:false};
const $=id=>document.getElementById(id),titulo=$('titulo'),contenido=$('contenido'),error=$('error'),anterior=$('anterior'),continuar=$('continuar');
const escapar=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function campo(id,label,tipo='text',extra=''){return `<div class="grupo"><label class="etiqueta" for="${id}">${label} <span class="req">*</span></label><input id="${id}" class="campo" type="${tipo}" value="${escapar(estado[id])}" ${extra}></div>`}
function renderDatos(){contenido.innerHTML=`${campo('NombreCompletoLider','Nombre completo del líder')}${campo('CorreoLider','Correo del líder','email')}<div class="fila">${campo('NumeroColab','Número del colaborador','text','inputmode="numeric"')}${campo('Puesto','Puesto del colaborador')}</div><div class="fila">${campo('Marca','Marca')}${campo('Sucursal','Sucursal')}</div>`;['NombreCompletoLider','CorreoLider','Puesto','Marca','Sucursal'].forEach(id=>$(id).oninput=e=>estado[id]=e.target.value);$('NumeroColab').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'');estado.NumeroColab=e.target.value}}  
function pregunta(n,texto){return `<fieldset class="pregunta"><legend class="texto-pregunta">${n}. ${texto} <span class="req">*</span></legend><div class="opciones">${ESCALA.map((et,i)=>`<div class="opcion"><input id="Q${n}_${i+1}" name="Q${n}" type="radio" value="${i+1}" ${estado.q[n]===i+1?'checked':''}><label for="Q${n}_${i+1}"><span class="numero">${i+1}</span>${et}</label></div>`).join('')}</div></fieldset>`}
function renderSeccion(i){const s=SECCIONES[i];contenido.innerHTML=s.questions.map((q,j)=>pregunta(s.start+j,q)).join('');s.questions.forEach((_,j)=>{const n=s.start+j;document.querySelectorAll(`[name="Q${n}"]`).forEach(x=>x.onchange=e=>estado.q[n]=Number(e.target.value))})}
function checks(nombre,opciones,seleccion){return `<div class="checks">${opciones.map(o=>`<label class="check"><input name="${nombre}" type="checkbox" value="${escapar(o)}" ${seleccion.includes(o)?'checked':''}>${o}</label>`).join('')}</div>`}
function radios(nombre,opciones,valor,clase=''){return `<div class="radios ${clase}">${opciones.map((o,i)=>`<div class="opcion"><input id="${nombre}_${i}" name="${nombre}" type="radio" value="${escapar(o)}" ${valor===o?'checked':''}><label for="${nombre}_${i}">${o}</label></div>`).join('')}</div>`}
const seleccionados=n=>[...document.querySelectorAll(`[name="${n}"]:checked`)].map(x=>x.value);
function renderSeguimiento(){const hayBaja=Array.from({length:12},(_,i)=>i+1).some(n=>Number(estado.q[n])<=2);const op1=['Claridad de funciones','Organización y prioridades','Seguimiento de instrucciones','Cumplimiento de plazos','Políticas y procedimientos','Normas específicas del puesto','Comunicación con el responsable','Relaciones con el equipo','Habilidades técnicas','Puntualidad o asistencia','Imagen institucional'];const op2=['Procesos internos','Sistemas o herramientas','Atención al cliente o paciente','Comunicación','Seguridad o cumplimiento','Políticas institucionales'];const op4=['Mantener el seguimiento habitual','Reunión de retroalimentación','Capacitación adicional','Acompañamiento operativo','Clarificación de funciones','Seguimiento de puntualidad o asistencia','Ninguna acción adicional'];contenido.innerHTML=`<div class="seguimiento ${hayBaja?'':'oculto'}"><p class="texto-pregunta">¿En qué áreas necesita mayor apoyo el colaborador? <span class="req">*</span></p>${checks('L1',op1,estado.L1)}<textarea id="L1_COMENT" class="campo" placeholder="Describe una conducta o situación observable">${escapar(estado.L1_COMENT)}</textarea></div><div class="seguimiento"><p class="texto-pregunta">¿El colaborador necesita capacitación adicional para desempeñar sus actividades actuales? <span class="req">*</span></p>${radios('L2',['Sí','No'],estado.L2)}<div class="${estado.L2==='Sí'?'':'oculto'}">${checks('L2_CAT',op2,estado.L2_CAT)}<textarea id="L2_COMENT" class="campo" placeholder="Describe el conocimiento o habilidad por reforzar">${escapar(estado.L2_COMENT)}</textarea></div></div><div class="seguimiento"><p class="texto-pregunta">¿Cuál opción describe mejor la adaptación actual del colaborador? <span class="req">*</span></p>${radios('L3',['Avanza conforme a lo esperado','Avanza, pero requiere seguimiento adicional','Requiere un plan formal de apoyo'],estado.L3,'tres')}</div><div class="seguimiento"><p class="texto-pregunta">¿Qué acción consideras necesaria durante los siguientes 30 días? <span class="req">*</span></p>${checks('L4',op4,estado.L4)}<textarea id="L4_COMENT" class="campo" placeholder="Describe el acuerdo o acción principal">${escapar(estado.L4_COMENT)}</textarea></div><div class="consentimiento"><label for="Consentimiento"><input id="Consentimiento" type="checkbox" ${estado.Consentimiento?'checked':''}><span><strong>Confirmación y consentimiento</strong>Confirmo que la información proporcionada se basa en observaciones realizadas durante el periodo de adaptación del colaborador y autorizo a Recursos Humanos a utilizarla de forma confidencial para fines de seguimiento, capacitación y planes de apoyo.</span></label><p class="nota">Debes aceptar esta confirmación para enviar el seguimiento.</p></div>`;['L1','L2_CAT','L4'].forEach(n=>document.querySelectorAll(`[name="${n}"]`).forEach(x=>x.onchange=()=>estado[n]=seleccionados(n)));['L1_COMENT','L2_COMENT','L4_COMENT'].forEach(id=>$(id)?.addEventListener('input',e=>estado[id]=e.target.value));document.querySelectorAll('[name="L2"]').forEach(x=>x.onchange=e=>{estado.L2=e.target.value;if(estado.L2==='No'){estado.L2_CAT=[];estado.L2_COMENT=''}renderSeguimiento()});document.querySelectorAll('[name="L3"]').forEach(x=>x.onchange=e=>estado.L3=e.target.value);$('Consentimiento').onchange=e=>estado.Consentimiento=e.target.checked}
function validar(){const p=pasos[paso];if(p.tipo==='datos')return estado.NombreCompletoLider.trim()&&/^\S+@\S+\.\S+$/.test(estado.CorreoLider.trim())&&estado.NumeroColab.trim()&&estado.Marca.trim()&&estado.Sucursal.trim()&&estado.Puesto.trim();if(p.tipo==='seccion'){const s=SECCIONES[p.indice];return s.questions.every((_,j)=>estado.q[s.start+j]>=1)}const hayBaja=Array.from({length:12},(_,i)=>i+1).some(n=>Number(estado.q[n])<=2);if(hayBaja&&(!estado.L1.length||!estado.L1_COMENT.trim()))return false;if(!estado.L2||estado.L2==='Sí'&&(!estado.L2_CAT.length||!estado.L2_COMENT.trim()))return false;if(!estado.L3||!estado.L4.length||!estado.Consentimiento)return false;return true}
function payload(){const p={IDSeguimiento60:`${estado.NumeroColab.trim()}_MES60`,NombreCompletoLider:estado.NombreCompletoLider.trim(),CorreoLider:estado.CorreoLider.trim(),NumeroColab:estado.NumeroColab.trim(),Marca:estado.Marca.trim(),Sucursal:estado.Sucursal.trim(),Puesto:estado.Puesto.trim()};for(let i=1;i<=12;i++)p[`Q${i}`]=Number(estado.q[i]);return Object.assign(p,{L1:estado.L1.join('; '),L1_COMENT:estado.L1_COMENT.trim(),L2:estado.L2,L2_CAT:estado.L2_CAT.join('; '),L2_COMENT:estado.L2_COMENT.trim(),L3:estado.L3,L4:estado.L4.join('; '),L4_COMENT:estado.L4_COMENT.trim(),Consentimiento:Boolean(estado.Consentimiento)})}
function render(){error.classList.remove('visible');const p=pasos[paso];titulo.textContent=p.titulo;anterior.style.visibility=paso?'visible':'hidden';continuar.textContent=paso===pasos.length-1?'Enviar respuestas':'Continuar →';continuar.className=paso===pasos.length-1?'boton enviar':'boton continuar';p.tipo==='datos'?renderDatos():p.tipo==='seccion'?renderSeccion(p.indice):renderSeguimiento()}
continuar.onclick=async()=>{if(!validar()){error.textContent='Completa todos los campos obligatorios y acepta el consentimiento.';error.classList.add('visible');return}if(paso<pasos.length-1){paso++;render();scrollTo({top:0,behavior:'smooth'});return}if(FLOW_URL.includes('PEGA_AQUI')){error.textContent='Configura la URL del flujo.';error.classList.add('visible');return}continuar.disabled=true;continuar.textContent='Enviando...';try{const r=await fetch(FLOW_URL,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify(payload())});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={mensaje:t}}if(!r.ok||d.guardado===false)throw new Error(d.mensaje||`HTTP ${r.status}`);$('formulario').hidden=true;$('final').hidden=false}catch(e){error.textContent=`No fue posible registrar la respuesta. ${e.message}`;error.classList.add('visible');continuar.disabled=false;continuar.textContent='Enviar respuestas'}};anterior.onclick=()=>{if(paso){paso--;render()}};render();
</script></body></html>
