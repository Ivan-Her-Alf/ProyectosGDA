function renderDatos(){

function radios(nombre,opciones,valor,clase=''){return `<div class="radios ${clase}">${opciones.map((o,i)=>`<div class="opcion"><input id="${nombre}_${i}" name="${nombre}" type="radio" value="${escapar(o)}" ${valor===o?'checked':''}><label for="${nombre}_${i}">${o}</label></div>`).join('')}</div>`}
const seleccionados=n=>[...document.querySelectorAll(`[name="${n}"]:checked`)].map(x=>x.value);
function renderSeguimiento(){const hayBaja=Array.from({length:12},(_,i)=>i+1).some(n=>Number(estado.q[n])<=2);const op1=['Claridad de funciones','Organización y prioridades','Seguimiento de instrucciones','Cumplimiento de plazos','Políticas y procedimientos','Normas específicas del puesto','Comunicación con el responsable','Relaciones con el equipo','Habilidades técnicas','Puntualidad o asistencia','Imagen institucional'];const op2=['Procesos internos','Sistemas o herramientas','Atención al cliente o paciente','Comunicación','Seguridad o cumplimiento','Políticas institucionales'];const op4=['Mantener el seguimiento habitual','Reunión de retroalimentación','Capacitación adicional','Acompañamiento operativo','Clarificación de funciones','Seguimiento de puntualidad o asistencia','Ninguna acción adicional'];contenido.innerHTML=`<div class="seguimiento ${hayBaja?'':'oculto'}"><p class="texto-pregunta">¿En qué áreas necesita mayor apoyo el colaborador? <span class="req">*</span></p>${checks('L1',op1,estado.L1)}<textarea id="L1_COMENT" class="campo" placeholder="Describe una conducta o situación observable">${escapar(estado.L1_COMENT)}</textarea></div><div class="seguimiento"><p class="texto-pregunta">¿El colaborador necesita capacitación adicional para desempeñar sus actividades actuales? <span class="req">*</span></p>${radios('L2',['Sí','No'],estado.L2)}<div class="${estado.L2==='Sí'?'':'oculto'}">${checks('L2_CAT',op2,estado.L2_CAT)}<textarea id="L2_COMENT" class="campo" placeholder="Describe el conocimiento o habilidad por reforzar">${escapar(estado.L2_COMENT)}</textarea></div></div><div class="seguimiento"><p class="texto-pregunta">¿Cuál opción describe mejor la adaptación actual del colaborador? <span class="req">*</span></p>${radios('L3',['Avanza conforme a lo esperado','Avanza, pero requiere seguimiento adicional','Requiere un plan formal de apoyo'],estado.L3,'tres')}</div><div class="seguimiento"><p class="texto-pregunta">¿Qué acción consideras necesaria durante los siguientes 30 días? <span class="req">*</span></p>${checks('L4',op4,estado.L4)}<textarea id="L4_COMENT" class="campo" placeholder="Describe el acuerdo o acción principal">${escapar(estado.L4_COMENT)}</textarea></div><div class="consentimiento"><label for="Consentimiento"><input id="Consentimiento" type="checkbox" ${estado.Consentimiento?'checked':''}><span><strong>Confirmación y consentimiento</strong>Confirmo que la información proporcionada se basa en observaciones realizadas durante el periodo de adaptación del colaborador y autorizo a Recursos Humanos a utilizarla de forma confidencial para fines de seguimiento, capacitación y planes de apoyo.</span></label><p class="nota">Debes aceptar esta confirmación para enviar el seguimiento.</p></div>`;['L1','L2_CAT','L4'].forEach(n=>document.querySelectorAll(`[name="${n}"]`).forEach(x=>x.onchange=()=>estado[n]=seleccionados(n)));['L1_COMENT','L2_COMENT','L4_COMENT'].forEach(id=>$(id)?.addEventListener('input',e=>estado[id]=e.target.value));document.querySelectorAll('[name="L2"]').forEach(x=>x.onchange=e=>{estado.L2=e.target.value;if(estado.L2==='No'){estado.L2_CAT=[];estado.L2_COMENT=''}renderSeguimiento()});document.querySelectorAll('[name="L3"]').forEach(x=>x.onchange=e=>estado.L3=e.target.value);$('Consentimiento').onchange=e=>estado.Consentimiento=e.target.checked}
function validar(){const p=pasos[paso];if(p.tipo==='datos')return estado.NombreCompletoLider.trim()&&/^\S+@\S+\.\S+$/.test(estado.CorreoLider.trim())&&estado.Marca.trim()&&estado.Sucursal.trim()&&estado.NumeroColab.trim();if(p.tipo==='seccion'){const s=SECCIONES[p.indice];return s.questions.every((_,j)=>estado.q[s.start+j]>=1)}const hayBaja=Array.from({length:12},(_,i)=>i+1).some(n=>Number(estado.q[n])<=2);if(hayBaja&&(!estado.L1.length||!estado.L1_COMENT.trim()))return false;if(!estado.L2||estado.L2==='Sí'&&(!estado.L2_CAT.length||!estado.L2_COMENT.trim()))return false;if(!estado.L3||!estado.L4.length||!estado.Consentimiento)return false;return true}
function payload(){const p={IDSeguimiento60:`${estado.NumeroColab.trim()}_MES60`,NombreCompletoLider:estado.NombreCompletoLider.trim(),CorreoLider:estado.CorreoLider.trim(),NumeroColab:estado.NumeroColab.trim(),Marca:estado.Marca.trim(),Sucursal:estado.Sucursal.trim()};for(let i=1;i<=12;i++)p[`Q${i}`]=Number(estado.q[i]);return Object.assign(p,{L1:estado.L1.join('; '),L1_COMENT:estado.L1_COMENT.trim(),L2:estado.L2,L2_CAT:estado.L2_CAT.join('; '),L2_COMENT:estado.L2_COMENT.trim(),L3:estado.L3,L4:estado.L4.join('; '),L4_COMENT:estado.L4_COMENT.trim(),Consentimiento:Boolean(estado.Consentimiento)})}
function render(){error.classList.remove('visible');const p=pasos[paso];titulo.textContent=p.titulo;anterior.style.visibility=paso?'visible':'hidden';continuar.textContent=paso===pasos.length-1?'Enviar respuestas':'Continuar →';continuar.className=paso===pasos.length-1?'boton enviar':'boton continuar';p.tipo==='datos'?renderDatos():p.tipo==='seccion'?renderSeccion(p.indice):renderSeguimiento()}
continuar.onclick=async()=>{if(!validar()){error.textContent='Completa todos los campos obligatorios y acepta el consentimiento.';error.classList.add('visible');return}if(paso<pasos.length-1){paso++;render();scrollTo({top:0,behavior:'smooth'});return}if(FLOW_URL.includes('PEGA_AQUI')){error.textContent='Configura la URL del flujo.';error.classList.add('visible');return}continuar.disabled=true;continuar.textContent='Enviando...';try{const r=await fetch(FLOW_URL,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify(payload())});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={mensaje:t}}if(!r.ok||d.guardado===false)throw new Error(d.mensaje||`HTTP ${r.status}`);$('formulario').hidden=true;$('final').hidden=false}catch(e){error.textContent=`No fue posible registrar la respuesta. ${e.message}`;error.classList.add('visible');continuar.disabled=false;continuar.textContent='Enviar respuestas'}};anterior.onclick=()=>{if(paso){paso--;render()}};render();
</script></body></html>
