<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de cultura e integración - 30 días</title>
<style>
:root{--azul:#108EC3;--turquesa:#16A2AD;--menta:#4CB88E;--verde:#5AAE71;--lima:#92BC48;--lima2:#B0C002;--texto:#173444;--muted:#60747E;--blanco:#fff;--borde:#DDE9EA;--error:#B42318}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{min-height:100vh;margin:0;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:var(--texto);background-color:#F5FAFA;background-image:radial-gradient(circle at 0 0,rgba(16,142,195,.14),transparent 34%),radial-gradient(circle at 100% 100%,rgba(176,192,2,.15),transparent 36%),linear-gradient(145deg,#F7FCFD 0%,#F4FAF7 52%,#FAFCEB 100%)}
.tarjeta{width:100%;max-width:780px;margin:auto;overflow:hidden;background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.85);border-radius:28px;box-shadow:0 24px 70px rgba(16,142,195,.14)}.barra{height:8px;background:linear-gradient(90deg,var(--azul),var(--turquesa),var(--menta),var(--lima),var(--lima2))}.interior{padding:36px}.encabezado{text-align:center}.insignia{display:inline-flex;align-items:center;gap:8px;margin:0;padding:9px 16px;border-radius:999px;background:rgba(22,162,173,.09);color:var(--turquesa);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}.titulo{max-width:680px;margin:20px auto 0;font-size:30px;line-height:1.22;scroll-margin-top:20px;outline:none}.subtitulo{max-width:620px;margin:12px auto 0;color:var(--muted);font-size:14px;line-height:1.6}.progreso-texto{margin:24px 0 8px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:700}.progreso{height:8px;overflow:hidden;border-radius:999px;background:#E8F0F1}.avance{height:100%;width:0;background:linear-gradient(90deg,var(--azul),var(--turquesa),var(--verde));transition:.25s}.contenido{margin-top:28px;padding:24px;background:rgba(248,250,252,.75);border-radius:24px}.fila{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grupo{margin-bottom:18px}.etiqueta{display:block;margin-bottom:7px;font-size:14px;font-weight:700}.req{color:var(--azul)}.campo{width:100%;padding:13px 14px;background:#fff;color:var(--texto);border:1px solid var(--borde);border-radius:12px;font:14px Arial;outline:none;transition:.2s}.campo:focus{border-color:var(--turquesa);box-shadow:0 0 0 4px rgba(22,162,173,.10)}textarea.campo{min-height:120px;resize:vertical;line-height:1.5}.ayuda{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
.pregunta{margin:0 0 20px;padding:18px;background:#fff;border:1px solid #EEF3F4;border-radius:16px;box-shadow:0 3px 12px rgba(23,52,68,.05)}.texto-pregunta{margin:0 0 15px;font-size:14px;font-weight:700;line-height:1.5}.opciones{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.opcion{position:relative}.opcion input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.opcion label{min-height:78px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px 5px;background:#F7FAFA;color:#526B76;border:1px solid #E3ECEE;border-radius:12px;font-size:11px;line-height:1.25;text-align:center;cursor:pointer;transition:.2s}.opcion label:hover{background:#fff;border-color:var(--turquesa);transform:translateY(-1px)}.opcion input:checked+label{background:linear-gradient(135deg,var(--azul),var(--turquesa));color:#fff;border-color:var(--turquesa);box-shadow:0 6px 14px rgba(16,142,195,.20)}.numero{display:block;margin-bottom:5px;color:var(--azul);font-size:20px;font-weight:700}.opcion input:checked+label .numero{color:#fff}.seguimiento{margin-top:18px;padding:18px;background:#fff;border:1px solid #DCEBED;border-radius:16px}.seguimiento h3{margin:0 0 14px;font-size:15px}.radios{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.radios .opcion label{min-height:52px;font-size:12px;font-weight:700}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;align-items:flex-start;gap:9px;padding:11px;border:1px solid var(--borde);border-radius:11px;background:#F9FBFB;font-size:13px;line-height:1.35}.check input{margin-top:2px;accent-color:var(--turquesa)}.error{display:none;margin-top:20px;padding:13px 15px;background:#FFF5F5;color:var(--error);border:1px solid #FFD1CC;border-radius:12px;font-size:13px}.error.visible{display:block}.navegacion{margin-top:30px;display:flex;justify-content:space-between;gap:12px}.boton{min-height:46px;display:inline-flex;justify-content:center;align-items:center;padding:12px 20px;border-radius:12px;font:600 14px Arial;cursor:pointer;transition:.2s}.boton:hover{transform:translateY(-1px)}.boton:disabled{opacity:.6;cursor:not-allowed;transform:none}.anterior{background:#fff;color:#526B76;border:1px solid var(--borde)}.continuar{margin-left:auto;background:linear-gradient(135deg,var(--azul),var(--turquesa));color:#fff;border:0;box-shadow:0 7px 16px rgba(16,142,195,.20)}.enviar{margin-left:auto;background:linear-gradient(135deg,var(--verde),var(--lima));color:#fff;border:0}.final{padding:52px 20px;text-align:center}.check-final{width:64px;height:64px;display:flex;align-items:center;justify-content:center;margin:auto;border-radius:50%;background:rgba(76,184,142,.15);color:var(--verde);font-size:36px;font-weight:700}.final h1{margin:22px 0 0}.final p{color:var(--muted);line-height:1.6}.oculto{display:none!important}
@media(max-width:700px){body{padding:16px 12px}.interior{padding:24px 18px}.titulo{font-size:23px}.contenido{padding:16px}.fila,.checks{grid-template-columns:1fr}.opciones{grid-template-columns:1fr}.opcion label{min-height:56px;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 14px;text-align:left}.numero{width:25px;margin:0;text-align:center}.radios{grid-template-columns:1fr}.radios .opcion label{justify-content:center}.boton{flex:1;padding:12px}.continuar,.enviar{margin-left:0}}
</style>
</head>
<body>
<main class="tarjeta"><div class="barra"></div><div class="interior">
<div id="formulario">
<header class="encabezado"><p class="insignia">✦ Seguimiento RH · 30 días</p><h1 id="titulo" class="titulo" tabindex="-1"></h1><p id="subtitulo" class="subtitulo"></p></header>
<div class="progreso-texto"><span id="pasoTexto"></span><span id="porcentajeTexto"></span></div><div class="progreso"><div id="avance" class="avance"></div></div>
<section id="contenido" class="contenido"></section><div id="error" class="error"></div>
<footer class="navegacion"><button id="anterior" class="boton anterior" type="button">← Anterior</button><button id="continuar" class="boton continuar" type="button">Continuar →</button></footer>
</div>
<div id="final" class="final" hidden><div class="check-final">✓</div><h1>¡Gracias por compartir tu experiencia!</h1><p>Tu encuesta de cultura e integración fue registrada correctamente. Las respuestas serán tratadas de manera confidencial por Recursos Humanos.</p></div>
</div></main>
<script>
const FLOW_URL="https://default226a5b51d2894b31be72824bcc61e8.91.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/11/workflows/e3be2959a66643dba4c03ac5b1ef15df/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=JmjYsnqkHhMgC7FxABG3b3CwAiEi_lkgmgIKufXmIlM";
const etiquetas=['Totalmente en desacuerdo','En desacuerdo','Neutral','De acuerdo','Totalmente de acuerdo'];
const bloques={
 cultura:{titulo:'Cultura y comprensión organizacional',subtitulo:'Queremos conocer cómo has entendido la cultura y el funcionamiento de GDA durante tu primer mes.',inicio:1,preguntas:[
  'Después de mi primer mes, comprendo los valores y comportamientos esperados dentro de GDA.',
  'Conozco las políticas y reglas principales que debo seguir en mi trabajo.',
  'Entiendo cómo las actividades de mi puesto contribuyen a los objetivos de mi área y de GDA.',
  'Lo que he observado durante mi primer mes es congruente con la cultura presentada en la inducción.'
 ]},
 integracion:{titulo:'Integración al equipo',subtitulo:'Evalúa la bienvenida, comunicación y apoyo que has recibido en tu área.',inicio:5,preguntas:[
  'Recibí una bienvenida adecuada por parte de mi área y equipo de trabajo.',
  'Las personas de mi área han mostrado disposición para orientarme cuando lo necesito.',
  'He sido incluido en la comunicación, reuniones y actividades necesarias para realizar mi trabajo.',
  'Sé con quién acudir cuando tengo una duda, problema o necesidad de apoyo.'
 ]},
 acompanamiento:{titulo:'Acompañamiento inicial',subtitulo:'Cuéntanos cómo ha sido el seguimiento de tu responsable directo durante el primer mes.',inicio:9,preguntas:[
  'Mi responsable directo explicó claramente lo que esperaba de mí durante el primer mes.',
  'He recibido seguimiento suficiente sobre mi adaptación y mis primeras actividades.',
  'Cuando he solicitado apoyo, he recibido una respuesta útil y oportuna.',
  'Actualmente cuento con la información básica necesaria para continuar mi proceso de adaptación.'
 ]}
};
const secciones=[
 {clave:'datos',titulo:'Datos del colaborador',subtitulo:'Completa tus datos para iniciar el seguimiento de 30 días.'},
 {clave:'cultura',titulo:bloques.cultura.titulo,subtitulo:bloques.cultura.subtitulo},
 {clave:'integracion',titulo:bloques.integracion.titulo,subtitulo:bloques.integracion.subtitulo},
 {clave:'acompanamiento',titulo:bloques.acompanamiento.titulo,subtitulo:bloques.acompanamiento.subtitulo},
 {clave:'seguimiento',titulo:'Necesidades de seguimiento',subtitulo:'Estas respuestas permiten canalizar apoyos oportunos y confidenciales.'}
];
let paso=0;
const r={APaterno:'',AMaterno:'',Nombres:'',NumeroColab:'',Correo:'',NombreCompletoLider:'',q:{},S1:[],S1_COMENT:'',S2:'',S2_CAT:[],S2_COMENT:'',S3:[],S3_COMENT:'',S4:''};
const $=id=>document.getElementById(id),titulo=$('titulo'),subtitulo=$('subtitulo'),contenido=$('contenido'),error=$('error'),btnAnt=$('anterior'),btnSig=$('continuar');
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function campo(id,label,valor,tipo='text',extra=''){return `<div class="grupo"><label class="etiqueta" for="${id}">${label} <span class="req">*</span></label><input id="${id}" class="campo" type="${tipo}" value="${esc(valor)}" ${extra}></div>`}
function enlazar(id,key,numerico=false){$(id).addEventListener('input',e=>{if(numerico)e.target.value=e.target.value.replace(/\D/g,'');r[key]=e.target.value})}
function renderDatos(){contenido.innerHTML=`<div class="fila">${campo('APaterno','Apellido paterno',r.APaterno)}${campo('AMaterno','Apellido materno',r.AMaterno)}</div>${campo('Nombres','Nombre(s)',r.Nombres)}<div class="fila">${campo('NumeroColab','Número de colaborador',r.NumeroColab,'text','inputmode="numeric"')}${campo('Correo','Correo electrónico',r.Correo,'email')}</div>${campo('NombreCompletoLider','Nombre completo del responsable directo',r.NombreCompletoLider)}`;enlazar('APaterno','APaterno');enlazar('AMaterno','AMaterno');enlazar('Nombres','Nombres');enlazar('NumeroColab','NumeroColab',true);enlazar('Correo','Correo');enlazar('NombreCompletoLider','NombreCompletoLider')}
function pregunta(numero,texto){return `<fieldset class="pregunta"><legend class="texto-pregunta">${numero}. ${texto} <span class="req">*</span></legend><div class="opciones">${etiquetas.map((et,i)=>{const n=i+1;return `<div class="opcion"><input type="radio" id="Q${numero}_${n}" name="Q${numero}" value="${n}" ${Number(r.q[numero])===n?'checked':''}><label for="Q${numero}_${n}"><span class="numero">${n}</span><span>${et}</span></label></div>`}).join('')}</div></fieldset>`}
function renderBloque(clave){const b=bloques[clave];contenido.innerHTML=b.preguntas.map((p,i)=>pregunta(b.inicio+i,p)).join('');b.preguntas.forEach((_,i)=>{const n=b.inicio+i;document.querySelectorAll(`[name="Q${n}"]`).forEach(x=>x.addEventListener('change',e=>r.q[n]=Number(e.target.value)))})}
function checks(nombre,opciones,seleccion){return `<div class="checks">${opciones.map((o,i)=>`<label class="check"><input type="checkbox" name="${nombre}" value="${esc(o)}" ${seleccion.includes(o)?'checked':''}><span>${o}</span></label>`).join('')}</div>`}
function radios(nombre,opciones,valor){return `<div class="radios">${opciones.map((o,i)=>`<div class="opcion"><input type="radio" id="${nombre}_${i}" name="${nombre}" value="${esc(o)}" ${valor===o?'checked':''}><label for="${nombre}_${i}">${o}</label></div>`).join('')}</div>`}
function valorChecks(nombre){return [...document.querySelectorAll(`[name="${nombre}"]:checked`)].map(x=>x.value)}
function renderSeguimiento(){
 const culturaBaja=[1,2,3,4].some(n=>Number(r.q[n])<=2),liderBajo=[9,10,11].some(n=>Number(r.q[n])<=2);
 const cat1=['Valores y cultura','Código de conducta','Políticas internas','Prestaciones','Horarios y asistencia','Procesos administrativos','Protección de datos o confidencialidad','Estructura de la organización','Aplicación de la cultura en el trabajo diario','Otro'];
 const cat2=['Falta de información','Falta de acompañamiento','Comunicación del equipo','Trato recibido','Falta de herramientas o accesos','Organización del área','Horario o carga inicial','Cambio de responsable, sucursal o actividades','Otro'];
 const cat3=['Mayor claridad sobre mis actividades','Seguimiento más frecuente','Ayuda para priorizar','Respuesta a dudas','Retroalimentación','Mejor comunicación','Apoyo para integrarme al equipo','Atención a una situación de trato','Otro'];
 contenido.innerHTML=`
 <div class="seguimiento ${culturaBaja?'':'oculto'}" id="bloqueS1"><h3>Aspectos culturales por reforzar</h3><p class="texto-pregunta">¿Qué aspecto necesitas comprender mejor? <span class="req">*</span></p>${checks('S1',cat1,r.S1)}<div class="grupo"><label class="etiqueta" for="S1_COMENT">Describe brevemente qué información o explicación necesitas <span class="req">*</span></label><textarea id="S1_COMENT" class="campo">${esc(r.S1_COMENT)}</textarea></div></div>
 <div class="seguimiento"><h3>Integración durante el primer mes</h3><p class="texto-pregunta">¿Durante tu primer mes ocurrió alguna situación que dificultara tu integración? <span class="req">*</span></p>${radios('S2',['No','Sí','Prefiero no responder'],r.S2)}<div id="detalleS2" class="${r.S2==='Sí'?'':'oculto'}"><div class="grupo"><label class="etiqueta">¿Con qué se relacionó principalmente? <span class="req">*</span></label>${checks('S2_CAT',cat2,r.S2_CAT)}</div><div class="grupo"><label class="etiqueta" for="S2_COMENT">Describe qué ocurrió y qué apoyo consideras necesario <span class="req">*</span></label><textarea id="S2_COMENT" class="campo">${esc(r.S2_COMENT)}</textarea></div></div></div>
 <div class="seguimiento ${liderBajo?'':'oculto'}" id="bloqueS3"><h3>Apoyo del responsable directo</h3><p class="texto-pregunta">¿Qué tipo de apoyo necesitas de tu responsable directo? <span class="req">*</span></p>${checks('S3',cat3,r.S3)}<div class="grupo"><label class="etiqueta" for="S3_COMENT">Describe el apoyo que tendría mayor impacto</label><textarea id="S3_COMENT" class="campo">${esc(r.S3_COMENT)}</textarea></div></div>
 <div class="seguimiento"><h3>Contacto confidencial</h3><p class="texto-pregunta">¿Te gustaría que una persona de RH se comunique contigo de manera confidencial? <span class="req">*</span></p>${radios('S4',['Sí','No','Aún no estoy seguro'],r.S4)}</div>`;
 document.querySelectorAll('[name="S1"]').forEach(x=>x.onchange=()=>r.S1=valorChecks('S1'));$('S1_COMENT')?.addEventListener('input',e=>r.S1_COMENT=e.target.value);
 document.querySelectorAll('[name="S2"]').forEach(x=>x.onchange=e=>{r.S2=e.target.value;if(r.S2!=='Sí'){r.S2_CAT=[];r.S2_COMENT=''}renderSeguimiento()});
 document.querySelectorAll('[name="S2_CAT"]').forEach(x=>x.onchange=()=>r.S2_CAT=valorChecks('S2_CAT'));$('S2_COMENT')?.addEventListener('input',e=>r.S2_COMENT=e.target.value);
 document.querySelectorAll('[name="S3"]').forEach(x=>x.onchange=()=>r.S3=valorChecks('S3'));$('S3_COMENT')?.addEventListener('input',e=>r.S3_COMENT=e.target.value);
 document.querySelectorAll('[name="S4"]').forEach(x=>x.onchange=e=>r.S4=e.target.value);
}
function validar(){const k=secciones[paso].clave;if(k==='datos')return r.APaterno.trim()&&r.AMaterno.trim()&&r.Nombres.trim()&&r.NumeroColab.trim()&&/^\S+@\S+\.\S+$/.test(r.Correo.trim())&&r.NombreCompletoLider.trim();if(bloques[k]){const b=bloques[k];return b.preguntas.every((_,i)=>r.q[b.inicio+i]>=1&&r.q[b.inicio+i]<=5)}if(k==='seguimiento'){const culturaBaja=[1,2,3,4].some(n=>Number(r.q[n])<=2),liderBajo=[9,10,11].some(n=>Number(r.q[n])<=2);if(culturaBaja&&(!r.S1.length||!r.S1_COMENT.trim()))return false;if(!r.S2)return false;if(r.S2==='Sí'&&(!r.S2_CAT.length||!r.S2_COMENT.trim()))return false;if(liderBajo&&!r.S3.length)return false;if(!r.S4)return false;return true}return true}
function render(){error.classList.remove('visible');const s=secciones[paso];titulo.textContent=s.titulo;subtitulo.textContent=s.subtitulo;const pct=Math.round((paso+1)/secciones.length*100);$('pasoTexto').textContent=`Paso ${paso+1} de ${secciones.length}`;$('porcentajeTexto').textContent=`${pct}%`;$('avance').style.width=`${pct}%`;btnAnt.style.visibility=paso===0?'hidden':'visible';btnSig.textContent=paso===secciones.length-1?'Enviar respuestas':'Continuar →';btnSig.className=paso===secciones.length-1?'boton enviar':'boton continuar';({datos:renderDatos,cultura:()=>renderBloque('cultura'),integracion:()=>renderBloque('integracion'),acompanamiento:()=>renderBloque('acompanamiento'),seguimiento:renderSeguimiento}[s.clave])()}
function payload(){const culturaBaja=[1,2,3,4].some(n=>Number(r.q[n])<=2),liderBajo=[9,10,11].some(n=>Number(r.q[n])<=2);const p={APaterno:r.APaterno.trim(),AMaterno:r.AMaterno.trim(),Nombres:r.Nombres.trim(),NumeroColab:r.NumeroColab.trim(),Correo:r.Correo.trim(),NombreCompletoLider:r.NombreCompletoLider.trim()};for(let i=1;i<=12;i++)p[`Q${i}`]=Number(r.q[i]);p.S1=culturaBaja?r.S1.join('; '):'';p.S1_COMENT=culturaBaja?r.S1_COMENT.trim():'';p.S2=r.S2;p.S2_CAT=r.S2==='Sí'?r.S2_CAT.join('; '):'';p.S2_COMENT=r.S2==='Sí'?r.S2_COMENT.trim():'';p.S3=liderBajo?r.S3.join('; '):'';p.S3_COMENT=liderBajo?r.S3_COMENT.trim():'';p.S4=r.S4;return p}
async function enviar(){if(!FLOW_URL||FLOW_URL.includes('PEGA_AQUI'))throw new Error('Configura FLOW_URL antes de publicar.');const p=payload();console.log('Payload cultura Mes 1:',p);const resp=await fetch(FLOW_URL,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify(p)});const texto=await resp.text();let d={};if(texto){try{d=JSON.parse(texto)}catch{d={mensaje:texto}}}if(resp.status===409)throw new Error(d.mensaje||'Ya existe una respuesta para este colaborador.');if(!resp.ok||d.guardado===false)throw new Error(d.mensaje||`Power Automate respondió con HTTP ${resp.status}`);return d}
btnSig.onclick=async()=>{if(!validar()){error.textContent='Completa todos los campos obligatorios y las preguntas de seguimiento visibles.';error.classList.add('visible');return}if(paso<secciones.length-1){paso++;render();titulo.scrollIntoView({behavior:'smooth',block:'start'});return}const t=btnSig.textContent;btnSig.disabled=true;btnSig.textContent='Enviando...';try{await enviar();$('formulario').hidden=true;$('final').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}catch(e){error.textContent=`No fue posible registrar las respuestas. ${e.message}`;error.classList.add('visible');btnSig.disabled=false;btnSig.textContent=t}};
btnAnt.onclick=()=>{if(paso>0){paso--;render();titulo.scrollIntoView({behavior:'smooth',block:'start'})}};
render();
</script>
</body>
</html>
