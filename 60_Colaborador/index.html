<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encuesta 60 días · Colaborador</title><style>
:root{--a:#108ec3;--t:#16a2ad;--m:#4cb88e;--v:#5aae71;--l:#92bc48;--tx:#173444;--mu:#60747e;--bd:#dde9ea;--er:#b42318}*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:28px 16px;font-family:Arial;color:var(--tx);background:radial-gradient(circle at 0 0,#108ec322,transparent 35%),radial-gradient(circle at 100% 100%,#92bc4826,transparent 38%),linear-gradient(145deg,#f7fcfd,#f4faf7 52%,#fafceb)}.card{max-width:820px;margin:auto;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 24px 70px #108ec324}.top{height:8px;background:linear-gradient(90deg,var(--a),var(--t),var(--m),var(--l))}.inner{padding:36px}.head{text-align:center}.badge{display:inline-flex;padding:9px 16px;border-radius:999px;background:#16a2ad17;color:var(--t);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}.title{margin:20px 0 0;font-size:30px}.content{margin-top:28px;padding:24px;background:#f8fafb;border-radius:24px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.group{margin-bottom:18px}.label{display:block;margin-bottom:7px;font-size:14px;font-weight:700}.req{color:var(--a)}.field{width:100%;padding:13px 14px;border:1px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx);font:14px Arial;outline:none}.field:focus{border-color:var(--t);box-shadow:0 0 0 4px #16a2ad19}textarea.field{min-height:110px;resize:vertical}.box{margin-bottom:18px;padding:18px;border:1px solid #e7f0f1;border-radius:16px;background:#fff}.q{margin:0 0 14px;font-size:14px;font-weight:700;line-height:1.5}.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.opt{position:relative}.opt input{position:absolute;width:1px;height:1px;opacity:0}.opt label{min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 5px;border:1px solid #e3ecee;border-radius:12px;background:#f7fafa;color:#526b76;font-size:11px;text-align:center;cursor:pointer}.opt input:checked+label{background:linear-gradient(135deg,var(--a),var(--t));color:#fff}.n{margin-bottom:5px;color:var(--a);font-size:20px;font-weight:700}.opt input:checked+label .n{color:#fff}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:9px;padding:11px;border:1px solid var(--bd);border-radius:11px;background:#f9fbfb;font-size:13px}.check input,.consent input{accent-color:var(--t)}.radios{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.radios.three{grid-template-columns:repeat(3,1fr)}.radios .opt label{min-height:52px;font-size:12px;font-weight:700}.consent{margin-top:20px;padding:18px;border:1px solid #cfe3e7;border-radius:16px;background:#f4fbfb}.consent label{display:flex;align-items:flex-start;gap:12px;font-size:13px;line-height:1.55;cursor:pointer}.consent input{width:18px;height:18px;flex:none;margin-top:2px}.consent strong{display:block;margin-bottom:3px;font-size:14px}.note{margin:8px 0 0 30px;color:var(--mu);font-size:11px}.error{display:none;margin-top:18px;padding:13px;border:1px solid #ffd1cc;border-radius:12px;background:#fff5f5;color:var(--er);font-size:13px}.error.show{display:block}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}.btn{min-height:46px;padding:12px 20px;border-radius:12px;font:600 14px Arial;cursor:pointer}.prev{background:#fff;color:#526b76;border:1px solid var(--bd)}.next{margin-left:auto;border:0;background:linear-gradient(135deg,var(--a),var(--t));color:#fff}.send{margin-left:auto;border:0;background:linear-gradient(135deg,var(--v),var(--l));color:#fff}.hidden{display:none!important}.final{padding:54px 20px;text-align:center}.final p{color:var(--mu)}@media(max-width:700px){body{padding:14px 10px}.inner{padding:24px 17px}.title{font-size:23px}.content{padding:16px}.row,.checks,.opts,.radios,.radios.three{grid-template-columns:1fr}.opt label{min-height:54px}.btn{flex:1}.next,.send{margin-left:0}}
</style></head><body><main class="card"><div class="top"></div><div class="inner"><div id="form"><header class="head"><p class="badge">✦ Seguimiento CH · 60 días ✦</p><h1 id="title" class="title">Datos del colaborador</h1></header><section id="content" class="content"></section><div id="error" class="error"></div><footer class="nav"><button id="prev" class="btn prev">← Anterior</button><button id="next" class="btn next">Continuar →</button></footer></div><section id="final" class="final" hidden><h1>¡Gracias por compartir tu experiencia!</h1><p>La respuesta fue registrada de manera confidencial para seguimiento de Recursos Humanos.</p></section></div></main><script>
const FLOW_URL='https://default226a5b51d2894b31be72824bcc61e8.91.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/23/workflows/349870002d1b48dc9e2382468f5650e6/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=j8i1zc8hsTdjIcBfTp0HWFftIz_HrhAlBmN9xljFHho';
const SECTIONS=[{"title": "Liderazgo de mi jefe directo", "start": 1, "questions": ["Mi jefe directo comunica de manera clara las expectativas y objetivos del área.", "Mi jefe directo me brinda retroalimentación constructiva sobre mi desempeño.", "Mi jefe directo reconoce y valora mi trabajo cuando lo realizo correctamente.", "Mi jefe directo me apoya en mi desarrollo profesional y crecimiento.", "Mi jefe directo toma decisiones de manera justa y equitativa.", "Mi jefe directo está disponible cuando necesito orientación.", "Mi jefe directo fomenta un ambiente de respeto y confianza en el equipo.", "Mi jefe directo da el ejemplo mediante su comportamiento y actitud."]}, {"title": "Comunicación organizacional", "start": 9, "questions": ["GDA comunica de manera clara nuestro propósito como organización.", "Recibo información oportuna sobre cambios importantes en la organización.", "Existen canales efectivos para expresar ideas, inquietudes, quejas o sugerencias.", "La comunicación entre las áreas con las que interactúo es fluida.", "Me encuentro informado sobre los objetivos de la empresa."]}, {"title": "Clima laboral", "start": 14, "questions": ["Me siento cómodo en mi lugar de trabajo.", "Existe un ambiente de respeto y colaboración entre compañeros.", "La empresa promueve un equilibrio adecuado entre la vida laboral y personal.", "Percibo que mi trabajo es valioso para el equipo y para GDA.", "Considero que GDA se preocupa por el bienestar de sus colaboradores."]}, {"title": "Desarrollo y crecimiento profesional", "start": 19, "questions": ["La empresa me proporciona la capacitación necesaria para desempeñar mi puesto.", "Tengo claridad sobre las posibilidades de crecimiento dentro de la empresa.", "Me siento motivado para desarrollar nuevas habilidades.", "Percibo que la empresa reconoce y promueve el talento interno."]}];
const SCALE=['Totalmente en desacuerdo','En desacuerdo','Neutral','De acuerdo','Totalmente de acuerdo'];
const steps=[{type:'data',title:'Datos del colaborador'},...SECTIONS.map((s,i)=>({type:'section',index:i,title:s.title})),{type:'follow',title:'Seguimiento confidencial'}];
let step=0;const st={APaterno:'',AMaterno:'',Nombres:'',NumeroColab:'',q:{},C1:[],C1_COMENT:'',C2:[],C2_COMENT:'',C3:'',C3_CAT:[],C3_COMENT:'',C4:[],C4_COMENT:'',C5:'',C5_MOTIVO:'',C5_COMENT:'',SOLICITA_RH:'',Consentimiento:false};
const $=id=>document.getElementById(id),title=$('title'),content=$('content'),err=$('error'),prev=$('prev'),next=$('next');
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function fld(id,label,type='text',extra=''){return `<div class="group"><label class="label">${label} <span class="req">*</span></label><input id="${id}" class="field" type="${type}" value="${esc(st[id])}" ${extra}></div>`}
function data(){content.innerHTML=`<div class="row">${fld('APaterno','Apellido paterno')}${fld('AMaterno','Apellido materno')}</div>${fld('Nombres','Nombre(s)')}${fld('NumeroColab','Número de colaborador','text','inputmode="numeric"')}`;['APaterno','AMaterno','Nombres'].forEach(id=>$(id).oninput=e=>st[id]=e.target.value);$('NumeroColab').oninput=e=>{e.target.value=e.target.value.replace(/\\D/g,'');st.NumeroColab=e.target.value}}  
  function qhtml(n,text){return `<fieldset class="box"><legend class="q">${n}. ${text} *</legend><div class="opts">${SCALE.map((x,i)=>`<div class="opt"><input id="q${n}_${i+1}" name="q${n}" type="radio" value="${i+1}" ${st.q[n]===i+1?'checked':''}><label for="q${n}_${i+1}"><span class="n">${i+1}</span>${x}</label></div>`).join('')}</div></fieldset>`}
function section(i){const s=SECTIONS[i];content.innerHTML=s.questions.map((x,j)=>qhtml(s.start+j,x)).join('');s.questions.forEach((_,j)=>{const n=s.start+j;document.querySelectorAll(`[name="q${n}"]`).forEach(x=>x.onchange=e=>st.q[n]=Number(e.target.value))})}
function checks(name,arr,val){return `<div class="checks">${arr.map(x=>`<label class="check"><input name="${name}" type="checkbox" value="${esc(x)}" ${val.includes(x)?'checked':''}>${x}</label>`).join('')}</div>`}
function radios(name,arr,val,cls=''){return `<div class="radios ${cls}">${arr.map((x,i)=>`<div class="opt"><input id="${name}_${i}" name="${name}" type="radio" value="${esc(x)}" ${val===x?'checked':''}><label for="${name}_${i}">${x}</label></div>`).join('')}</div>`}
const getChecks=n=>[...document.querySelectorAll(`[name="${n}"]:checked`)].map(x=>x.value);const low=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i).some(n=>Number(st.q[n])<=2);
function follow(){const a1=['Claridad sobre expectativas y objetivos','Retroalimentación sobre mi desempeño','Reconocimiento de mi trabajo','Apoyo para mi desarrollo','Trato justo y equitativo','Disponibilidad para resolver dudas','Ambiente de respeto y confianza','Congruencia entre lo que comunica y lo que realiza'],a2=['Claridad de los mensajes','Oportunidad de la información','Comunicación de cambios','Canales para expresar inquietudes','Comunicación entre áreas','Comunicación de objetivos','Seguimiento a dudas o solicitudes'],a3=['Problemas con el equipo','Falta de respeto','Carga de trabajo','Incompatibilidad de horarios','Falta de herramientas o accesos','Falta de organización','Comunicación deficiente','Situación con el responsable directo'],a4=['Capacitación técnica','Capacitación en procesos','Capacitación en sistemas o herramientas','Mayor claridad sobre posibilidades de crecimiento','Retroalimentación sobre habilidades por desarrollar','Participación en nuevos proyectos','Acompañamiento del responsable directo','Por el momento no lo tengo definido'],mot=['Liderazgo','Ambiente del equipo','Trato recibido','Puesto diferente a lo esperado','Carga de trabajo','Incompatibilidad de horarios','Sueldo o prestaciones','Traslado o ubicación','Falta de capacitación','Falta de crecimiento','Oferta laboral externa','Situación personal'];content.innerHTML=`<div class="box ${low(1,8)?'':'hidden'}"><p class="q">¿En qué aspecto necesitas mayor apoyo de tu jefe directo? *</p>${checks('C1',a1,st.C1)}<textarea id="C1_COMENT" class="field">${esc(st.C1_COMENT)}</textarea></div><div class="box ${low(9,13)?'':'hidden'}"><p class="q">¿Qué aspecto de la comunicación debería mejorarse? *</p>${checks('C2',a2,st.C2)}<textarea id="C2_COMENT" class="field">${esc(st.C2_COMENT)}</textarea></div><div class="box"><p class="q">¿Durante las últimas cuatro semanas ocurrió alguna situación que afectara negativamente tu experiencia laboral? *</p>${radios('C3',['Sí','No'],st.C3)}<div class="${st.C3==='Sí'?'':'hidden'}">${checks('C3_CAT',a3,st.C3_CAT)}<textarea id="C3_COMENT" class="field">${esc(st.C3_COMENT)}</textarea></div></div><div class="box ${[19,20,22].some(n=>st.q[n]<=2)?'':'hidden'}"><p class="q">¿Qué apoyo de desarrollo necesitas actualmente? *</p>${checks('C4',a4,st.C4)}<textarea id="C4_COMENT" class="field">${esc(st.C4_COMENT)}</textarea></div><div class="box"><p class="q">Durante las últimas cuatro semanas, ¿has considerado dejar GDA? *</p>${radios('C5',['No','Sí, ocasionalmente','Sí, frecuentemente'],st.C5,'three')}<div class="${st.C5.startsWith('Sí')?'':'hidden'}"><select id="C5_MOTIVO" class="field"><option value="">Selecciona la razón principal</option>${mot.map(x=>`<option ${st.C5_MOTIVO===x?'selected':''}>${x}</option>`).join('')}</select><textarea id="C5_COMENT" class="field">${esc(st.C5_COMENT)}</textarea></div></div><div class="box"><p class="q">¿Te gustaría que una persona de RH se comunique contigo de manera confidencial? *</p>${radios('SOLICITA_RH',['Sí','No'],st.SOLICITA_RH)}</div><div class="consent"><label><input id="Consentimiento" type="checkbox" ${st.Consentimiento?'checked':''}><span><strong>Confirmación y consentimiento</strong>Confirmo que las respuestas proporcionadas reflejan mi experiencia y autorizo a Recursos Humanos a utilizarlas de forma confidencial para fines de seguimiento, mejora del proceso y atención de las situaciones reportadas.</span></label><p class="note">Debes aceptar esta confirmación para enviar la encuesta.</p></div>`;['C1','C2','C3_CAT','C4'].forEach(n=>document.querySelectorAll(`[name="${n}"]`).forEach(x=>x.onchange=()=>st[n]=getChecks(n)));['C1_COMENT','C2_COMENT','C3_COMENT','C4_COMENT','C5_COMENT'].forEach(id=>$(id)?.addEventListener('input',e=>st[id]=e.target.value));document.querySelectorAll('[name="C3"]').forEach(x=>x.onchange=e=>{st.C3=e.target.value;if(st.C3==='No'){st.C3_CAT=[];st.C3_COMENT=''}follow()});document.querySelectorAll('[name="C5"]').forEach(x=>x.onchange=e=>{st.C5=e.target.value;if(!st.C5.startsWith('Sí')){st.C5_MOTIVO='';st.C5_COMENT=''}follow()});$('C5_MOTIVO')?.addEventListener('change',e=>st.C5_MOTIVO=e.target.value);document.querySelectorAll('[name="SOLICITA_RH"]').forEach(x=>x.onchange=e=>st.SOLICITA_RH=e.target.value);$('Consentimiento').onchange=e=>st.Consentimiento=e.target.checked}
function valid(){const x=steps[step];if(x.type==='data')return st.APaterno.trim()&&st.AMaterno.trim()&&st.Nombres.trim()&&st.NumeroColab.trim();if(x.type==='section'){const s=SECTIONS[x.index];return s.questions.every((_,j)=>st.q[s.start+j]>=1)}if(low(1,8)&&(!st.C1.length||!st.C1_COMENT.trim()))return false;if(low(9,13)&&(!st.C2.length||!st.C2_COMENT.trim()))return false;if(!st.C3||st.C3==='Sí'&&(!st.C3_CAT.length||!st.C3_COMENT.trim()))return false;if([19,20,22].some(n=>st.q[n]<=2)&&!st.C4.length)return false;if(!st.C5||st.C5.startsWith('Sí')&&!st.C5_MOTIVO||!st.SOLICITA_RH||!st.Consentimiento)return false;return true}
function payload(){const p={IDSeguimiento60:`${st.NumeroColab.trim()}_MES60`,APaterno:st.APaterno.trim(),AMaterno:st.AMaterno.trim(),Nombres:st.Nombres.trim(),NumeroColab:st.NumeroColab.trim()};for(let i=1;i<=22;i++)p[`Q${i}`]=Number(st.q[i]);return Object.assign(p,{C1:st.C1.join('; '),C1_COMENT:st.C1_COMENT.trim(),C2:st.C2.join('; '),C2_COMENT:st.C2_COMENT.trim(),C3:st.C3,C3_CAT:st.C3_CAT.join('; '),C3_COMENT:st.C3_COMENT.trim(),C4:st.C4.join('; '),C4_COMENT:st.C4_COMENT.trim(),C5:st.C5,C5_MOTIVO:st.C5_MOTIVO,C5_COMENT:st.C5_COMENT.trim(),SOLICITA_RH:st.SOLICITA_RH,Consentimiento:Boolean(st.Consentimiento)})}
function render(){err.classList.remove('show');const x=steps[step];title.textContent=x.title;prev.style.visibility=step?'visible':'hidden';next.textContent=step===steps.length-1?'Enviar respuestas':'Continuar →';next.className=step===steps.length-1?'btn send':'btn next';x.type==='data'?data():x.type==='section'?section(x.index):follow()}
next.onclick=async()=>{if(!valid()){err.textContent='Completa todos los campos obligatorios y acepta el consentimiento.';err.classList.add('show');return}if(step<steps.length-1){step++;render();scrollTo({top:0,behavior:'smooth'});return}if(FLOW_URL.includes('PEGA_AQUI')){err.textContent='Configura la URL del flujo.';err.classList.add('show');return}next.disabled=true;next.textContent='Enviando...';try{const res=await fetch(FLOW_URL,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify(payload())});const text=await res.text();let d={};try{d=text?JSON.parse(text):{}}catch{d={mensaje:text}}if(!res.ok||d.guardado===false)throw new Error(d.mensaje||`HTTP ${res.status}`);$('form').hidden=true;$('final').hidden=false}catch(e){err.textContent=`No fue posible registrar la respuesta. ${e.message}`;err.classList.add('show');next.disabled=false;next.textContent='Enviar respuestas'}};prev.onclick=()=>{if(step){step--;render()}};render();
</script></body></html>
